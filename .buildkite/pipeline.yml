agents:
  queue: default

env:
  IMAGE_ID: $IMAGE_ID

common_params:
  plugins:
    - &docker_plugin
      docker#v5.8.0:
        image: public.ecr.aws/docker/library/ruby:3.4.13
        propagate-environment: true
        environment:
          - RUBYGEMS_API_KEY

steps:
  #################
  # Build and Test
  #################
  - group: "Tests"
    key: tests
    steps:
      - label: ":rust: Run Tests"
        command: |
          make test
        notify:
          - github_commit_status:
              context: "Rust Tests"

  #################
  # Lint
  #################
  - label: ":rust: Lint"
    command: |
      echo "--- :rust: Running Clippy"
      make lint-rust

      echo "--- :rust: Ensuring Code Conforms to rustfmt"
      make fmt-check-rust
    notify:
      - github_commit_status:
          context: "Rust Lint"
  - label: ":ruby: Rubocop + RSpec"
    # for now, running in the default queue to avoid the need of a Gemfile the root directory
    command: cd ruby && bundle install && bundle exec rubocop && bundle exec rspec
    key: ruby-lint-and-tests
    retry:
      manual:
        permit_on_passed: true
    plugins: [*docker_plugin]
    notify:
      - github_commit_status:
          context: "Ruby Lint and Tests"

  #################
  # [DO NOT MERGE] Validate the macOS release build on xcode-27.2-v4
  #################
  - group: "[DO NOT MERGE] xcode-27.2-v4 validation"
    steps:
      - label: "[DO NOT MERGE] Assert the VM is xcode-27.2-v4"
        command: .buildkite/commands/assert-image.sh v4
        agents:
          queue: mac

      - label: "[DO NOT MERGE] Control: assert the check rejects xcode-27.2-v3"
        command: .buildkite/commands/assert-image.sh v3
        env:
          IMAGE_ID: xcode-27.2-v3
        agents:
          queue: mac

      # Same as ":mac: macOS Binaries", minus the GitHub release upload: `build_rust` instead of `build_and_create_github_release`.
      - label: "[DO NOT MERGE] :mac: macOS Binaries (x86_64 + ARM64), no upload"
        command: |
          .buildkite/commands/assert-image.sh v4
          echo "--- :rust: Installing Rust"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -v -y
          source "$$HOME/.cargo/env"
          cd ruby
          install_gems
          for platform in x86_64-darwin arm64-darwin; do
            echo "--- :hammer: Building $$platform"
            bundle exec rake "build_rust[$$platform]"
          done
          echo "--- :mag: Built binaries"
          find ../target -path '*/release/*' -maxdepth 3 -type f -perm -u+x -exec file {} \;
        plugins: [$CI_TOOLKIT]
        agents:
          queue: mac

  #################
  # Release Binaries
  #################
  - group: "📦 Release Binaries"
    key: release-binaries
    if: build.tag != null
    depends_on:
      - tests
      - ruby-lint-and-tests
    steps:
      - label: ":linux: Linux Binaries (x86_64 + ARM64)"
        command: |
          echo "--- :package: Building Linux binaries using Docker cross-compilation"
          .buildkite/release-binary.sh x86_64-linux
          .buildkite/release-binary.sh arm64-linux
        plugins: [$CI_TOOLKIT]
        agents:
          queue: android

      - label: ":mac: macOS Binaries (x86_64 + ARM64)"
        command: |
          echo "--- :package: Building macOS binaries natively"
          echo "--- :rust: Installing Rust"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -v -y
          source "$$HOME/.cargo/env"
          
          .buildkite/release-binary.sh x86_64-darwin
          .buildkite/release-binary.sh arm64-darwin
        plugins: [$CI_TOOLKIT]
        agents:
          queue: mac

  #################
  # Push to RubyGems
  #################
  - label: ":rubygems: Publish to RubyGems"
    key: gem-push
    if: build.tag != null
    depends_on:
     - release-binaries
    command: .buildkite/gem-push.sh
    plugins: [*docker_plugin]
